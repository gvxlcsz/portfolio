<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<title>klws</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:linear-gradient(
        135deg,
        #000000 0%,
        #1a1a1a 30%,
        #4d4d4d 60%,
        #d9d9d9 100%
    );
}

/* ---------------- Welcome Screen ---------------- */

#welcome{
    position:fixed;
    inset:0;

    background:#000;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    color:white;

    cursor:pointer;

    z-index:999;

    transition:transform 1.1s cubic-bezier(.77,0,.18,1);
}

#welcome h1{
    font-size:72px;
    font-weight:600;
}

#welcome p{
    margin-top:18px;
    color:#777;
    letter-spacing:4px;
    text-transform:uppercase;
    font-size:12px;
}

#welcome.hide{
    transform:translateY(-100%);
}

/* ---------------- Dashboard ---------------- */

#dashboard{
    width:100%;
    min-height:100vh;

    background:
        linear-gradient(
            rgba(0,0,0,.55),
            rgba(0,0,0,.55)
        ),
        url("swag.png");

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    background-attachment:fixed;

    opacity:0;
    transform:translateY(20px);

    transition:
        opacity .8s ease,
        transform .8s ease;

    padding-top:70px;
}

#dashboard.show{

    opacity:1;
    transform:translateY(0);

}

/* ---------------- Header ---------------- */

header{

    position:fixed;

    top:0;
    left:0;

    width:100%;
    height:70px;

    background:rgba(15,15,15,.75);

    backdrop-filter:blur(15px);

    border-bottom:1px solid rgba(255,255,255,.08);

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:0 40px;

    z-index:100;

}

.logo{

    color:white;
    font-size:22px;
    font-weight:bold;

}

.nav{

    display:flex;
    align-items:center;
    gap:20px;

}

.nav a{

    color:#cfcfcf;

    text-decoration:none;

    font-size:22px;

    transition:.3s ease;

}

.nav a:hover{

    color:white;

    transform:translateY(-2px);

}

/* ---------------- Hero ---------------- */

.hero{
    height:calc(100vh - 70px);

    display:flex;
    flex-direction:column;

    justify-content:center;
    align-items:center;

    text-align:center;
}

/* Profile */

.profile-frame{

    width:170px;
    height:170px;

    border-radius:50%;

    overflow:hidden;

    border:6px solid #555;

    background:#222;

    box-shadow:0 0 25px rgba(255,255,255,.08);

    margin-bottom:35px;

}

.profile-frame img{

    width:100%;
    height:100%;
    
    object-fit:cover;

}

/* Bear Logo */

.name-logo{

    width:260px;
    max-width:80%;

    margin-bottom:30px;
    position:relative;
    left:-15px;
    top:-18px;

}

/* Tagline */

.tagline{

    color:white;

    font-size:32px;

    font-style:italic;

    font-weight:300;

}

</style>

</head>

<body>

<!-- Welcome Screen -->

<div id="welcome">

    <h1>Welcome.</h1>
    <p>Click anywhere to enter</p>

</div>

<!-- Dashboard -->

<div id="dashboard">

    <header>

        <div class="logo">
            klws
        </div>

        <div class="nav">

            <a href="https://github.com/gvxlcsz" target="_blank" title="GitHub">
                <i class="fa-brands fa-github"></i>
            </a>

            <a href="https://discord.com/users/864809444239999047" target="_blank" title="Discord">
                <i class="fa-brands fa-discord"></i>
            </a>

            <a href="mailto:kailws2005@gmailcom" title="Email">
                <i class="fa-solid fa-envelope"></i>
            </a>

        </div>

    </header>

    <main class="hero">

        <div class="profile-frame">

            <img src="profile.png" alt="klws">

        </div>

        <img src="name.png" class="name-logo" alt="klws">

        <p class="tagline">

            Code with Purpose.

        </p>

    </main>

</div>

<script>

const welcome = document.getElementById("welcome");
const dashboard = document.getElementById("dashboard");

welcome.addEventListener("click",()=>{

    welcome.classList.add("hide");

    setTimeout(()=>{

        dashboard.classList.add("show");

    },400);

    setTimeout(()=>{

        welcome.remove();
        document.body.style.overflow="auto";

    },1100);

});

</script>

</body>
</html>
